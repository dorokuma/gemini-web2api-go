name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不装 QEMU:Dockerfile 里 builder 钉了 $BUILDPLATFORM,arm64 那份是
      # GOARCH 交叉编译出来的,不需要模拟执行。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action 顺带写入 org.opencontainers.image.source 标签,
      # GHCR 靠它把包关联回本仓库(仓库页右侧 Packages 区块的来源)。
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # 版本号跟 release workflow 同一套：tag 去掉 v 前缀注入，分支构建给 dev。
      - name: Compute image version
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/v*) echo "version=$v" >> "$GITHUB_OUTPUT" ;;
          *) echo "version=dev" >> "$GITHUB_OUTPUT" ;; esac

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 镜像里 --version 报的版本跟 tag 走；分支构建没有 tag，注入 "dev"。
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
