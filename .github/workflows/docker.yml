name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v5.0.0); leave empty on a branch for branch image build'
        required: false
        type: string

concurrency:
  group: docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      # 解析构建目标：手动派发 inputs.tag > push tag > 分支构建。
      # tag   保留 v 前缀（docker metadata tag、git ref 用）
      # version 去掉 v（--build-arg VERSION 注入用）
      - name: Resolve build target
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            cand="$INPUT_TAG"
            if ! awk -v s="$cand" 'BEGIN { exit !(s !~ /[\r\n]/ && s ~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/) }'; then
              echo "::error::inputs.tag '$INPUT_TAG' is not strict SemVer vX.Y.Z"
              exit 1
            fi
            echo "is_release=true"              >> "$GITHUB_OUTPUT"
            echo "tag=$cand"                    >> "$GITHUB_OUTPUT"
            echo "version=${cand#v}"            >> "$GITHUB_OUTPUT"
            echo "checkout_ref=refs/tags/$cand" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            tag="${GITHUB_REF_NAME}"
            cand="$tag"
            if ! awk -v s="$cand" 'BEGIN { exit !(s !~ /[\r\n]/ && s ~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/) }'; then
              echo "::error::tag '$tag' is not strict SemVer vX.Y.Z"
              exit 1
            fi
            echo "is_release=true"   >> "$GITHUB_OUTPUT"
            echo "tag=$tag"          >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}"  >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false"  >> "$GITHUB_OUTPUT"
            echo "tag=dev"           >> "$GITHUB_OUTPUT"
            echo "version=dev"       >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.checkout_ref }}
          fetch-depth: 0

      # 同 release.yml：checkout 不保证本地有 refs/tags/<tag> 对象。
      # 顺带判定该 tag 是不是全仓最高正式版 SemVer——只有最高者才发 :latest，
      # 防止回填旧 tag 或 push main 把 GHCR :latest 刷回旧版或 dev。
      - name: Fetch release tag object
        id: latest_guard
        if: steps.ver.outputs.is_release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git fetch --tags --force origin
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          highest="$(git tag -l | awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ { print }' | sort -V | tail -n 1)"
          if [ "$highest" = "$TAG" ]; then
            echo "is_latest_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make check
        run: make check

      - name: make release-check
        if: steps.ver.outputs.is_release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: make release-check TAG="$TAG"

      # 不装 QEMU:Dockerfile 里 builder 钉了 $BUILDPLATFORM,arm64 那份是
      # GOARCH 交叉编译出来的,不需要模拟执行。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action 顺带写入 org.opencontainers.image.source 标签,
      # GHCR 靠它把包关联回本仓库(仓库页右侧 Packages 区块的来源)。
      # context: git 让手动派发 tag 时 OCI revision 取 tag 提交 SHA 而非触发
      # 分支 SHA。手动派发 inputs.tag 时 type=ref,event=tag 不会触发,靠 type=raw
      # 兜底；:latest 仅由全仓最高 SemVer 正式版 tag 发出。
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          context: git
          tags: |
            type=ref,event=branch,enable=${{ steps.ver.outputs.is_release != 'true' }}
            type=ref,event=tag
            type=raw,value=${{ steps.ver.outputs.tag }},enable=${{ steps.ver.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.is_release == 'true' && steps.latest_guard.outputs.is_latest_release == 'true' }}

      # 版本号跟 release workflow 同一套：tag 去掉 v 前缀注入，分支构建给 dev。
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 镜像里 --version 报的版本跟 tag 走；分支构建没有 tag，注入 "dev"。
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
